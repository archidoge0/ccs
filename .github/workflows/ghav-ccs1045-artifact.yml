name: GHAV CCS #1045 build/test artifact core

on:
  push:
    branches: ["codex/ghav-ccs1045-*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'

      - name: Restore bun + node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            ui/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Ensure dependencies
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile
          [ -d ui/node_modules ] || (cd ui && bun install --frozen-lockfile)

      - name: Build
        run: bun run build:all

      - name: Dist output witness
        run: |
          test -d dist
          count=$(find dist -type f | wc -l)
          test "$count" -gt 0
          echo "DIST_FILE_COUNT=$count"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print "DIST_SHA256="$1}'

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    name: test
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'

      - name: Restore bun + node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            ui/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Ensure dependencies
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile
          [ -d ui/node_modules ] || (cd ui && bun install --frozen-lockfile)

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Test
        run: bun run test:all
      - name: Dist output witness
        run: |
          test -d dist
          count=$(find dist -type f | wc -l)
          test "$count" -gt 0
          echo "DIST_FILE_COUNT=$count"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print "DIST_SHA256="$1}'
