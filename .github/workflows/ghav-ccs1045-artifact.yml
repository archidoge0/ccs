name: GHAV CCS #1045 build/test artifact core

on:
  push:
    branches: ["codex/ghav-ccs1045-*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: build,     cmd: 'bun run build:all' }
          - { name: test,      cmd: 'bun run build:all && bash .github/scripts/ghav-ccs1045-test-isolated.sh' }
    name: ${{ matrix.check.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'

      - name: Restore bun + node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            ui/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Ensure dependencies
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile
          [ -d ui/node_modules ] || (cd ui && bun install --frozen-lockfile)

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}
      - name: Dist output witness
        run: |
          test -d dist
          count=$(find dist -type f | wc -l)
          test "$count" -gt 0
          echo "DIST_FILE_COUNT=$count"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print "DIST_SHA256="$1}'
