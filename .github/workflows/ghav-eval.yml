# Fixed build/test core of kaitranntt/ccs#1045; all jobs are required.
name: GHAV ccs 1045
on:
  push:
    branches: ['codex/ghav-ccs-1045-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: deps-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            ui/node_modules
          key: ${{ runner.os }}-ghav-ccs-1045-${{ hashFiles('bun.lock', 'ui/bun.lock') }}
      - name: Record cache state
        run: echo "GHAV_CACHE_HIT=${{ steps.deps-cache.outputs.cache-hit }}"
      - name: Ensure dependencies
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile
          [ -d ui/node_modules ] || (cd ui && bun install --frozen-lockfile)
      - name: Build
        run: bun run build:all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: deps-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            ui/node_modules
          key: ${{ runner.os }}-ghav-ccs-1045-${{ hashFiles('bun.lock', 'ui/bun.lock') }}
      - name: Record cache state
        run: echo "GHAV_CACHE_HIT=${{ steps.deps-cache.outputs.cache-hit }}"
      - name: Ensure dependencies
        run: |
          [ -d node_modules ] || bun install --frozen-lockfile
          [ -d ui/node_modules ] || (cd ui && bun install --frozen-lockfile)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - name: Test
        run: bun run test:all
